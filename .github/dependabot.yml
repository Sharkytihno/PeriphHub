# Les actions GitHub sont épinglées à une empreinte de commit (workflows/*.yml) : Dependabot propose
# leurs montées de version, une fois par mois, regroupées dans une seule demande.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
