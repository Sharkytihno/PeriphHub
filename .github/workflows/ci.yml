name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fichiers de données JSON valides
        shell: pwsh
        run: Get-ChildItem data/*.json | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json | Out-Null; "$($_.Name) OK" }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pilotes contre appareils simulés (Logitech, Razer, SteelSeries…)
        run: node --test tests/drivers.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Module casques (HeadsetControl, empreinte vérifiée)
        shell: pwsh
        run: ./scripts/fetch-headsetcontrol.ps1
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - name: Tests Rust (Core Audio, DirectShow, garde-fous)
        working-directory: src-tauri
        run: cargo test
