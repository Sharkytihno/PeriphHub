name: CI

on:
  push:
    branches: [master]
  pull_request:

# Le jeton de la CI ne peut que lire le dépôt
permissions:
  contents: read

jobs:
  check:
    # Seulement sur le dépôt public : pas sur les copies et dérivés privés
    if: github.repository == 'Sharkytihno/PeriphHub'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fichiers de données JSON valides
        shell: pwsh
        run: Get-ChildItem data/*.json | ForEach-Object { Get-Content $_ -Raw | ConvertFrom-Json | Out-Null; "$($_.Name) OK" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Syntaxe des scripts de l'interface
        shell: pwsh
        run: Get-ChildItem ui -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit 1 } }
      - name: Tests JS (pilotes contre appareils simulés, relais des diagnostics)
        run: npm test
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branche stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'
      - name: Module casques (HeadsetControl, empreinte vérifiée)
        shell: pwsh
        run: ./scripts/fetch-headsetcontrol.ps1
      - name: Éclairage (OpenRGB portable, empreinte vérifiée)
        shell: pwsh
        run: ./scripts/fetch-openrgb.ps1
      - name: Températures (LibreHardwareMonitor, empreintes vérifiées, compilé avec le csc de Windows)
        shell: pwsh
        run: ./scripts/fetch-sensors.ps1
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests Rust (Core Audio, DirectShow, garde-fous)
        working-directory: src-tauri
        run: cargo test
