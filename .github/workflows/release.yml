name: Release

# Pousser un tag « v0.9.0 » compile l'installeur Windows et prépare une Release (brouillon à publier).
# Notes de la Release : section de la version dans CHANGELOG.md (scripts/release-notes.ps1).
# Signature : si les secrets SignPath sont présents (voir docs/SIGNATURE.md), periphhub.exe puis
# l'installeur sont signés par SignPath Foundation (certificat gratuit pour les logiciels libres).
# Sans ces secrets, l'installeur est publié non signé.
# Actions épinglées à une empreinte de commit : une étiquette (« v4 ») peut être déplacée par son auteur,
# et ce travail fabrique l'installeur signé que reçoivent tous les utilisateurs. Dependabot propose les
# montées de version (.github/dependabot.yml).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT: periphhub
  SIGNPATH_POLICY: release-signing
  SIGNPATH_CONFIG: exe-in-zip
  # Clé de signature des mises à jour intégrées (docs/MISES-A-JOUR.md) ; sans elle, pas de latest.json
  HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}

jobs:
  windows:
    # Seulement sur le dépôt public : pas sur les copies et dérivés privés
    if: github.repository == 'Sharkytihno/PeriphHub'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branche stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'
      - name: Module casques (HeadsetControl, empreinte vérifiée)
        shell: pwsh
        run: ./scripts/fetch-headsetcontrol.ps1
      - name: Éclairage (OpenRGB portable, empreinte vérifiée)
        shell: pwsh
        run: ./scripts/fetch-openrgb.ps1
      - name: Températures (LibreHardwareMonitor, empreintes vérifiées, compilé avec le csc de Windows)
        shell: pwsh
        run: ./scripts/fetch-sensors.ps1
      - run: npm ci

      # 1. Programme seul
      - name: Compilation
        run: npx tauri build --no-bundle

      # 2. Signature de periphhub.exe (avant de l'emballer dans l'installeur)
      - name: Programme à signer
        id: exe
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: periphhub-exe-unsigned
          path: src-tauri/target/release/periphhub.exe
          if-no-files-found: error
      - name: Signature du programme (SignPath)
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_CONFIG }}
          github-artifact-id: ${{ steps.exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: src-tauri/target/release

      # 3. Installeur (contient le programme signé)
      - name: Installeur
        run: npx tauri bundle --bundles nsis
      - name: Chemin de l'installeur
        id: setup
        shell: pwsh
        run: |
          $f = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($f.Name)" >> $env:GITHUB_OUTPUT

      # 4. Signature de l'installeur
      - name: Installeur à signer
        id: inst
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: periphhub-setup-unsigned
          path: ${{ steps.setup.outputs.path }}
          if-no-files-found: error
      - name: Signature de l'installeur (SignPath)
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_CONFIG }}
          github-artifact-id: ${{ steps.inst.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: src-tauri/target/release/bundle/nsis
      - name: Vérification des signatures
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($f in @('src-tauri/target/release/periphhub.exe', '${{ steps.setup.outputs.path }}')) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) — $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "signature invalide : $f" }
          }

      # 5. Paquet MSIX pour le Microsoft Store (non signé : le Store le signe lui-même).
      #    Identité : variables du dépôt MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_NAME
      #    (Partner Center > Identité du produit) ; sans elles, paquet provisoire. docs/MICROSOFT-STORE.md
      - name: Paquet Microsoft Store (MSIX)
        id: msix
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
        run: |
          $a = @{}
          if ($env:MSIX_IDENTITY_NAME) { $a.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $a.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_NAME) { $a.PublisherName = $env:MSIX_PUBLISHER_NAME }
          ./scripts/build-msix.ps1 @a
          $f = Get-ChildItem src-tauri/target/release/*.msix | Select-Object -First 1
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT

      # 6. Mise à jour intégrée : installeur signé avec la clé du projet + latest.json, que PeriphHub
      #    lit sur la dernière release publiée (un brouillon n'est proposé à personne)
      - name: Fichier de mise à jour (latest.json)
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_UPDATER_KEY == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SETUP: ${{ steps.setup.outputs.path }}
          TAG: ${{ github.ref_name }}
        run: |
          npx tauri signer sign -p "" "$SETUP" < /dev/null > /dev/null
          node scripts/updater-manifest.js "$SETUP" "$TAG"

      # 7. Release (brouillon) avec l'installeur et son empreinte
      - name: Installeur (lancement manuel, sans release)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: periphhub-setup
          path: ${{ steps.setup.outputs.path }}
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ env.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          $setup = '${{ steps.setup.outputs.path }}'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ steps.setup.outputs.name }}" | Out-File -Encoding ascii "$setup.sha256"
          # texte littéral (here-string '@) : aucun guillemet du texte n'est interprété par PowerShell
          if ($env:SIGNED -eq 'true') {
            $warn = @'
          L'installeur est signé (SignPath Foundation). / The installer is signed (SignPath Foundation).
          '@
          } else {
            $warn = @'
          Windows peut afficher « Windows a protégé votre ordinateur » (programme pas encore signé) : « Informations complémentaires » puis « Exécuter quand même ».

          Windows may show "Windows protected your PC" (not signed yet): click "More info", then "Run anyway".
          '@
          }
          # Nouveautés : section de cette version dans CHANGELOG.md
          $changes = ./scripts/release-notes.ps1 '${{ github.ref_name }}'
          $body = @'
          Téléchargez / Download **{NAME}**.

          {WARN}

          {CHANGES}

          SHA-256 : `{HASH}`

          Le fichier .msix sert uniquement à la publication sur le Microsoft Store. / The .msix file is only for the Microsoft Store submission.
          '@
          $body = $body.Replace('{NAME}', '${{ steps.setup.outputs.name }}').Replace('{WARN}', $warn).Replace('{HASH}', $hash).Replace('{CHANGES}', $changes)
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -Path $notes -Value $body -Encoding utf8
          $files = @($setup, "$setup.sha256", '${{ steps.msix.outputs.path }}')
          $latest = Join-Path (Split-Path $setup) 'latest.json'
          if (Test-Path $latest) { $files += $latest } else { Write-Host '::warning::pas de latest.json : mise à jour intégrée indisponible pour cette version' }
          gh release create '${{ github.ref_name }}' @files --draft --title 'PeriphHub ${{ github.ref_name }}' --notes-file $notes
