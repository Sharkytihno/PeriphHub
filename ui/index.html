<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PeriphHub</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <script src="js/theme.js"></script>
  <script src="i18n/en.js"></script>
  <script src="js/i18n.js"></script>
</head>
<body>
  <nav>
    <div class="brand">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="phg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cff"/><stop offset=".48" stop-color="#5b7bff"/><stop offset="1" stop-color="#22c8ee"/></linearGradient></defs>
        <rect width="64" height="64" rx="17" fill="url(#phg)"/>
        <g class="orbit" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
          <path d="M42.7 18.9A17 17 0 0 1 48.7 35.6M44.4 43.7A17 17 0 0 1 19.6 43.7M15.3 35.6A17 17 0 0 1 21.3 18.9" opacity=".55"/>
          <circle cx="32" cy="15" r="4.6" fill="#fff" stroke="none"/><circle cx="46.7" cy="40.5" r="4.6" fill="#fff" stroke="none"/><circle cx="17.3" cy="40.5" r="4.6" fill="#fff" stroke="none"/>
        </g>
        <circle cx="32" cy="32" r="7.5" fill="#fff"/>
      </svg>
      <span class="wm">Periph<b>Hub</b><small id="appVer"></small></span>
    </div>
    <button data-tab="home">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span class="nl">Accueil<small id="homeSub">Vue d’ensemble</small></span>
    </button>
    <button data-tab="slim">
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 19c9 0 14-6 14-15-9 0-14 5-14 14z"/><path d="M5 19 13 11"/></svg>
      <span class="nl">Allègement<small id="slimSub">Analyse…</small></span><span class="badge" id="slimBadge" hidden></span>
    </button>

    <div class="ngroup" id="devGroup" hidden>Mes appareils</div>
    <button data-tab="mouse" hidden>
      <svg class="ic" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="6"/><path d="M12 7v4"/></svg>
      <span class="nl">Souris<small id="mouseSub">Non connectée</small></span><span class="dot" data-for="mouseStatus"></span>
    </button>
    <button data-tab="keyboard" hidden>
      <svg class="ic" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7.5 14h9"/></svg>
      <span class="nl">Clavier<small id="kbSub">Non connecté</small></span><span class="dot" data-for="kbStatus"></span>
    </button>
    <button data-tab="headset" hidden>
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
      <span class="nl">Casque<small id="hsSub">Non connecté</small></span><span class="dot" data-for="hsStatus"></span>
    </button>
    <button data-tab="rgb" hidden>
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg>
      <span class="nl">Éclairage<small id="rgbSub">Carte mère</small></span><span class="dot" data-for="rgbStatus"></span>
    </button>

    <div class="nfoot">
      <button data-tab="options">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
        <span class="nl">Options<small id="verSub">PeriphHub</small></span>
      </button>
    </div>
  </nav>

  <main>
    <section class="page" id="home">
      <header class="phead">
        <div class="ptitle"><h2 id="homeTitle">Bonjour</h2><div class="muted small" id="homeLead">Tous vos périphériques, d’un coup d’œil.</div></div>
        <div class="pact"><button class="ghost" id="rescan">Actualiser</button></div>
      </header>
      <div id="homeBody"></div>
    </section>

    <section class="page" id="slim">
      <header class="phead">
        <div class="ptitle"><h2>Allègement</h2><div class="muted small">Les logiciels constructeurs qui tournent en fond, et ce que vous gagnez à les fermer.</div></div>
        <div class="pact"><span class="status" id="slimStatus"></span><button class="ghost" id="copyReport" disabled>Copier le rapport</button></div>
      </header>
      <div id="slimBody"></div>
    </section>

    <section class="page" id="mouse">
      <header class="phead">
        <div class="ptitle"><h2 id="mouseTitle">Souris</h2><div class="muted small" id="mouseMeta"></div></div>
        <div class="pact"><span class="status" id="mouseStatus">Non connectée</span><button id="mouseConnect">Connecter</button></div>
      </header>
      <div id="mouseBody" class="pbody"></div>
    </section>

    <section class="page" id="keyboard">
      <header class="phead">
        <div class="ptitle"><h2 id="keyboardTitle">Clavier</h2><div class="muted small" id="kbMeta"></div></div>
        <div class="pact"><span class="status" id="kbStatus">Non connecté</span><button id="kbConnect">Connecter</button></div>
      </header>
      <div id="kbBody" class="pbody"></div>
    </section>

    <section class="page" id="headset">
      <header class="phead">
        <div class="ptitle"><h2 id="headsetTitle">Casque</h2><div class="muted small" id="hsMeta"></div></div>
        <div class="pact"><span class="status" id="hsStatus">Non connecté</span><button id="hsConnect">Connecter</button></div>
      </header>
      <div id="hsBody" class="pbody"></div>
    </section>

    <section class="page" id="rgb">
      <header class="phead">
        <div class="ptitle"><h2 id="rgbTitle">Éclairage de la carte mère</h2><div class="muted small" id="rgbMeta"></div></div>
        <div class="pact"><span class="status" id="rgbStatus">Non connecté</span></div>
      </header>
      <div id="rgbBody" class="pbody"></div>
    </section>

    <section class="page" id="options">
      <header class="phead"><div class="ptitle"><h2>Options</h2></div></header>
      <div id="optBody" class="pbody"></div>
    </section>
  </main>
  <div id="toasts" aria-live="polite"></div>
  <script src="js/hid-descriptor.js" defer></script>
  <script src="js/native-hid.js" defer></script>
  <script src="js/protocols/scyrox.js" defer></script>
  <script src="js/protocols/rekt.js" defer></script>
  <script src="js/protocols/razer.js" defer></script>
  <script src="js/protocols/fusion2.js" defer></script>
  <!-- Module ES : exécuté à son tour, comme les scripts defer (avant devices.js qui s'en sert) -->
  <script type="module" src="js/drivers/openmouse.js"></script>
  <script src="js/devices.js" defer></script>
  <script src="js/drivers/core.js" defer></script>
  <script src="js/drivers/logitech.js" defer></script>
  <script src="js/drivers/razer-chroma.js" defer></script>
  <script src="js/drivers/razer-kraken.js" defer></script>
  <script src="js/drivers/nzxt-kraken.js" defer></script>
  <script src="js/drivers/steelseries-apex.js" defer></script>
  <script src="js/drivers/corsair.js" defer></script>
  <script src="js/drivers/headsets.js" defer></script>
  <script src="js/drivers/headsets-native.js" defer></script>
  <script src="js/drivers/turtle-vulcan.js" defer></script>
  <script src="js/drivers/ranked.js" defer></script>
  <script src="js/drivers/playstation.js" defer></script>
  <script src="js/drivers/media.js" defer></script>
  <script src="js/drivers/via.js" defer></script>
  <script src="js/drivers/openrgb.js" defer></script>
  <script src="js/shell.js" defer></script>
</body>
</html>
